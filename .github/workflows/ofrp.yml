name: OrangeFox CI (SM-J330)

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - uses: actions/checkout@v7
    - name: Installing JDK 7 + Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
        cd /usr/local/src
        sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        sudo tar xvf Python-2.7.18.tgz
        cd Python-2.7.18
        sudo ./configure --enable-optimizations
        sudo make altinstall
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Syncing TWRP sources
      run: |
        mkdir ~/TWRP
        cd ~/TWRP
        mkdir ~/.bin
        curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        python3 ~/.bin/repo init --depth=1 -u https://github.com/unlegacy-devices/fox-7.1_manifest.git -b fox-7.1
        git clone --branch android-6.0 --single-branch https://github.com/notnoelchannel2/twrp_device_samsung_j3y17lte.git ~/TWRP/device/samsung/j3y17lte
        python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
    - name: Downloading Magisk v30.7 for Fox Addons
      run: |
        mkdir -p ~/fox-addons
        curl -L -o ~/fox-addons/Magisk-v30.7.zip https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
        echo "Saved to ~/fox-addons/Magisk-v30.7.zip — build step points FOX_USE_SPECIFIC_MAGISK_ZIP at this file"
    - name: Patching fox_list_apps for user + system apps
      run: |
        TARGET=$(find ~/TWRP -type f -path "*FoxExtras/sbin/fox_list_apps" 2>/dev/null | head -n1)
        if [ -z "$TARGET" ]; then
          echo "fox_list_apps not found in synced source — skipping patch, App Manager list may stay broken."
        else
          echo "Patching: $TARGET"
        cat > "$TARGET" << 'FOXLISTAPPS_EOF'
        #!/sbin/sh
        # fox_list_apps - patched
        #
        # Confirmed from gui/theme/.../pages/advanced.xml (apps_list page): App
        # Manager is a plain GUIFileSelector browsing amgr_path=/tmp/listapps/list.
        # There is no text-file format to write - each installed app needs to be
        # ONE entry (file, named however it should display) inside that directory.
        # The original script wrote nothing there at all (broken ls/cut parsing),
        # which is why the list was always empty regardless of what was installed.
        #
        # This version also scans /system/app and /system/priv-app in addition to
        # /data/app, since the original only ever covered user-installed apps.
        
        FOXAAPT="/sbin/aapt"
        list_dir="/tmp/listapps/list"
        rm -rf /tmp/listapps
        mkdir -p "$list_dir"
        
        # advanced.xml's apps_load page only does `mount /data` before calling this
        # script - /system is not guaranteed mounted, so system-app scanning would
        # silently find nothing without this. Try common mount points; ignore
        # failures (already mounted, or a scheme where /system doesn't exist as a
        # separate partition).
        mount /system 2>/dev/null
        mount -o ro /system 2>/dev/null
        
        add_entry() {
            local fullpath="$1"
            local tag="$2"
            local parent
            local pkgname
            local label
            local display
        
            parent="$(basename "$(dirname "$fullpath")")"
            case "$parent" in
                base.apk|"") pkgname="$(basename "$fullpath" .apk)" ;;
                *) pkgname="$(echo "$parent" | cut -d'-' -f1)" ;;
            esac
            [ -z "$pkgname" ] && return
        
            if [ -x "$FOXAAPT" ]; then
                label="$("$FOXAAPT" dump badging "$fullpath" 2>/dev/null | grep "application-label:" | head -1 | cut -d"'" -f2)"
            fi
        
            if [ -n "$label" ] && [ "$label" != "$pkgname" ]; then
                if [ "$tag" = "system" ]; then
                    display="[System] ${label} (${pkgname})"
                else
                    display="${label} (${pkgname})"
                fi
            else
                # no aapt / no readable label - showing "pkgname (pkgname)" is
                # redundant, just show the package name once
                if [ "$tag" = "system" ]; then
                    display="[System] ${pkgname}"
                else
                    display="${pkgname}"
                fi
            fi
        
            # filenames can't contain '/'; strip anything odd just in case a label has it
            display="$(echo "$display" | tr '/' '-')"
        
            # dedupe on package name so the same app isn't listed twice
            [ -e "$list_dir/$display" ] && return
        
            # advanced.xml's delete action does:
            #   rm -rf "$(cat "%amgr_file%")"
            # so each entry file must CONTAIN the real path to remove, not be empty.
            # For an app dir like /data/app/pkg-hash/base.apk, that's the pkg-hash
            # folder one level up from base.apk. This applies to system apps too
            # (/system/app, /system/priv-app) at the user's request - deleting a
            # system app folder here CAN break boot if it's something init/SystemUI
            # depends on. No extra confirmation beyond the normal swipe-to-confirm.
            echo "$(dirname "$fullpath")" > "$list_dir/$display" 2>/dev/null
        }
        
        scan_dir() {
            local base_dir="$1"
            local tag="$2"
            [ -d "$base_dir" ] || return
            find "$base_dir" -mindepth 1 -maxdepth 3 -iname "*.apk" 2>/dev/null | while read -r fullpath; do
                add_entry "$fullpath" "$tag"
            done
        }
        
        scan_dir "/data/app" "user"
        
        # System apps: try the flat AOSP-standard path first, then fall back to the
        # nested layout some OEM builds use (confirmed on this device: the real
        # system tree sits at /system/system/app, not /system/app directly - /system
        # itself just mounts the OEM partition root, with system/product/vendor as
        # subfolders inside it).
        scan_dir "/system/app" "system"
        scan_dir "/system/priv-app" "system"
        scan_dir "/system/system/app" "system"
        scan_dir "/system/system/priv-app" "system"
        
        exit 0
        FOXLISTAPPS_EOF
          chmod 755 "$TARGET"
          echo "Patched fox_list_apps successfully"
        fi
    - name: Building TWRP
      run: |
        OLDPATH=$PATH
        OLDJAVAHOME=$JAVA_HOME
        export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
        export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
        export FOX_USE_SPECIFIC_MAGISK_ZIP="$HOME/fox-addons/Magisk-v30.7.zip"
        cd ~/TWRP
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        export OF_USE_GREEN_LED=0
        export FOX_REMOVE_AAPT=1
        export OF_VANILLA_BUILD=1
        export OF_FLASHLIGHT_ENABLE=0
        export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/SYSTEM"
        export FOX_RECOVERY_BOOT_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/BOOT"
        export FOX_RECOVERY_INSTALL_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/RECOVERY"
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export OF_LEGACY_SHAR512=1
        export OF_DISABLE_KEYMASTER2=1
        export OF_MAINTAINER="notnoelchannel"
        export TARGET_ARCH="arm64"
        export FOX_BUILD_TYPE="Stable"
        lunch omni_j3y17lte-eng
        mka recoveryimage
        export PATH=$OLDPATH
        export JAVA_HOME=$OLDJAVAHOME
    - name: Repackaging OrangeFox zip
      id: repackage
      run: |
        cd /home/runner/TWRP/out/target/product/j3y17lte
        FOX_ZIP=$(find . -maxdepth 1 -iname "OrangeFox*.zip" | head -n1)
        if [ -z "$FOX_ZIP" ]; then
          echo "No OrangeFox zip found to repackage — skipping."
        else
          echo "Repackaging: $FOX_ZIP"
          mkdir -p /tmp/fox_repack
          unzip -q "$FOX_ZIP" -d /tmp/fox_repack
          rm -f "$FOX_ZIP"
          cd /tmp/fox_repack
          OUT_ZIP="/home/runner/TWRP/out/target/product/j3y17lte/$(basename "$FOX_ZIP")"
          rm -f "$OUT_ZIP"
          zip -X -D "$OUT_ZIP" META-INF/com/google/android/updater-script META-INF/com/google/android/update-binary > /dev/null
          zip -r -X -D "$OUT_ZIP" META-INF -x "META-INF/com/google/android/updater-script" -x "META-INF/com/google/android/update-binary" > /dev/null
          zip -r -X -D "$OUT_ZIP" . -x "META-INF/*" > /dev/null
          echo "Repackaged $(basename "$FOX_ZIP") with META-INF first"
          echo "zip_name=$(basename "$FOX_ZIP")" >> "$GITHUB_OUTPUT"
        fi
    - name: Uploading TWRP builds
      uses: actions/upload-artifact@v7
      with:
        name: ofrp
        path: /home/runner/TWRP/out/target/product/j3y17lte/recovery.*
        
    - name: Uploading OFRP ZIP build (installer, unzipped download)
      if: steps.repackage.outputs.zip_name != ''
      uses: actions/upload-artifact@v7
      with:
        path: /home/runner/TWRP/out/target/product/j3y17lte/${{ steps.repackage.outputs.zip_name }}
        archive: false

    - name: Uploading extra theme zips
      uses: actions/upload-artifact@v7
      with:
        name: ofrp-extras
        path: |
          /home/runner/TWRP/out/target/product/j3y17lte/*.zip
          !/home/runner/TWRP/out/target/product/j3y17lte/${{ steps.repackage.outputs.zip_name }}
