name: OrangeFox CI (SM-J330)

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - uses: actions/checkout@v7
    - name: Installing JDK 7 + Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
        cd /usr/local/src
        sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        sudo tar xvf Python-2.7.18.tgz
        cd Python-2.7.18
        sudo ./configure --enable-optimizations
        sudo make altinstall
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Syncing TWRP sources
      run: |
        mkdir ~/TWRP
        cd ~/TWRP
        mkdir ~/.bin
        curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        python3 ~/.bin/repo init --depth=1 -u https://github.com/unlegacy-devices/fox-7.1_manifest.git -b fox-7.1
        git clone --branch android-6.0 --single-branch https://github.com/notnoelchannel2/twrp_device_samsung_j3y17lte.git ~/TWRP/device/samsung/j3y17lte
        python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
    - name: Downloading Magisk v30.7 for Fox Addons
      run: |
        mkdir -p ~/fox-addons
        curl -L -o ~/fox-addons/Magisk-v30.7.zip https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
        echo "Saved to ~/fox-addons/Magisk-v30.7.zip — build step points FOX_USE_SPECIFIC_MAGISK_ZIP at this file"
    - name: Patching fox_list_apps for old and new layouts
      run: |
        TARGET=$(find ~/TWRP -type f -path "*FoxExtras/sbin/fox_list_apps" 2>/dev/null | head -n1)
        if [ -z "$TARGET" ]; then
          echo "fox_list_apps not found in synced source — skipping patch, App Manager list may stay broken."
        else
          echo "Patching: $TARGET"
          cat > "$TARGET" << 'FOXLISTAPPS_EOF'
        #!/sbin/sh
        #
        # Custom script for OrangeFox TWRP Recovery
        # Copyright (C) 2018-2022 OrangeFox Recovery Project
        #
        # This software is licensed under the terms of the GNU General Public
        # License version 2, as published by the Free Software Foundation, and
        # may be copied, distributed, and modified under those terms.
        #
        # This program is distributed in the hope that it will be useful,
        # but WITHOUT ANY WARRANTY; without even the implied warranty of
        # MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
        # GNU General Public License for more details.
        #
        # See <http://www.gnu.org/licenses/>.
        #
        # Please maintain this if you use this script or any part of it
        #
        # --- MODIFIED: find-based scan supports both flat (/data/app/<pkg>-<hash>/base.apk)
        # --- and nested (/data/app/~~<hash>==/<pkg>-<hash>==/base.apk) layouts.
        #

        is_mounted() {
          [ -z "$1" ] && { echo "0"; return; }
          grep -q " `readlink -f $1` " /proc/mounts 2>/dev/null
          [ "$?" = "1" ] && echo "0" || echo "1"
        }

        Do_Get_List() {
        local AAPT1="/sbin/aapt"
        local AAPT2="/sbin/aapt2"
        local tmp="/tmp/listapps"
        local list="$tmp/list"
        local apps_dir="/data/app"
        local namestr="application-label:'"
        local d_mnt=$(is_mounted "/data")

        	[ -d "$list" ] && return
        	[ "$d_mnt" != "1" ] && mount /data

        	mkdir -p "$tmp" "$list"

        	if [ -f "$AAPT1" -o -f "$AAPT2" ]; then
        	   AAPT="$AAPT1"
        	   [ ! -f "$AAPT1" ] && AAPT="$AAPT2"
        	   find "$apps_dir" -mindepth 1 -maxdepth 3 -name "base.apk" 2>/dev/null | while read -r apk; do
        	       fullpath=$(dirname "$apk")
        	       dirname_only=$(basename "$fullpath")
        	       pkgname=$(echo "$dirname_only" | cut -d'-' -f1)
        	       [ -z "$pkgname" ] && continue
        	       name=$($AAPT dump badging "$apk" | grep "$namestr" | sed "s/"$namestr"//" | sed "s/'//" | sed "s/'//")
        	       if [ -n "$name" -a -f "$list/$name" ]; then
        		    echo "$fullpath" > "$list/$name ($pkgname)"
        	       elif [ -n "$name" ]; then
        		    echo "$fullpath" > "$list/$name"
        	       else
        		    echo "$fullpath" > "$list/$pkgname"
        	       fi
        	   done
        	else
        	   find "$apps_dir" -mindepth 1 -maxdepth 3 -name "base.apk" 2>/dev/null | while read -r apk; do
        	       fullpath=$(dirname "$apk")
        	       dirname_only=$(basename "$fullpath")
        	       pkgname=$(echo "$dirname_only" | cut -d'-' -f1)
        	       [ -z "$pkgname" ] && continue
        	       echo "$fullpath" > "$list/$pkgname"
        	   done
        	fi

        	exit 0
        }

        Do_Cleanup() {
          exit 0
        }

        #
        if [ "$1" = "--cleanup" ]; then
           Do_Cleanup
        else
           Do_Get_List
        fi
        #
        FOXLISTAPPS_EOF
          chmod 755 "$TARGET"
          echo "Patched fox_list_apps successfully"
        fi
    - name: Building TWRP
      run: |
        OLDPATH=$PATH
        OLDJAVAHOME=$JAVA_HOME
        export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
        export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
        export FOX_USE_SPECIFIC_MAGISK_ZIP="$HOME/fox-addons/Magisk-v30.7.zip"
        cd ~/TWRP
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        export OF_USE_GREEN_LED=0
        export FOX_REMOVE_AAPT=1
        export OF_VANILLA_BUILD=1
        export OF_FLASHLIGHT_ENABLE=0
        export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/SYSTEM"
        export FOX_RECOVERY_BOOT_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/BOOT"
        export FOX_RECOVERY_INSTALL_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/RECOVERY"
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export OF_LEGACY_SHAR512=1
        export OF_DISABLE_KEYMASTER2=1
        export OF_MAINTAINER="notnoelchannel"
        export TARGET_ARCH="arm64"
        export FOX_BUILD_TYPE="Stable"
        lunch omni_j3y17lte-eng
        mka recoveryimage
        export PATH=$OLDPATH
        export JAVA_HOME=$OLDJAVAHOME
    - name: Repackaging OrangeFox zip
      run: |
        cd /home/runner/TWRP/out/target/product/j3y17lte
        FOX_ZIP=$(find . -maxdepth 1 -iname "OrangeFox*.zip" | head -n1)
        if [ -z "$FOX_ZIP" ]; then
          echo "No OrangeFox zip found to repackage — skipping."
        else
          echo "Repackaging: $FOX_ZIP"
          mkdir -p /tmp/fox_repack
          unzip -q "$FOX_ZIP" -d /tmp/fox_repack
          rm -f "$FOX_ZIP"
          cd /tmp/fox_repack
          OUT_ZIP="/home/runner/TWRP/out/target/product/j3y17lte/$(basename "$FOX_ZIP")"
          rm -f "$OUT_ZIP"
          zip -X -D "$OUT_ZIP" META-INF/com/google/android/updater-script META-INF/com/google/android/update-binary > /dev/null
          zip -r -X -D "$OUT_ZIP" META-INF -x "META-INF/com/google/android/updater-script" -x "META-INF/com/google/android/update-binary" > /dev/null
          zip -r -X -D "$OUT_ZIP" . -x "META-INF/*" > /dev/null
          echo "Repackaged $(basename "$FOX_ZIP") with META-INF first"
        fi
    - name: Uploading TWRP builds
      uses: actions/upload-artifact@v5
      with:
        name: ofrp
        path: /home/runner/TWRP/out/target/product/j3y17lte/recovery.*
        
    - name: Uploading OFRP ZIP builds
      uses: actions/upload-artifact@v5
      with:
        name: ofrpzip
        path: /home/runner/TWRP/out/target/product/j3y17lte/*.zip
