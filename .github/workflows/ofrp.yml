name: OrangeFox CI (SM-J330)

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP Build CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - uses: actions/checkout@v7
    - name: Installing JDK 7 + Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
        cd /usr/local/src
        sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        sudo tar xvf Python-2.7.18.tgz
        cd Python-2.7.18
        sudo ./configure --enable-optimizations
        sudo make altinstall
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Syncing TWRP sources
      run: |
        mkdir -p ~/.bin
        curl -o ~/.bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        chmod a+x ~/.bin/repo
        export PATH=~/.bin:$PATH
        mkdir ~/TWRP
        cd ~/TWRP
        # gitlab.com/OrangeFox/Manifest.git no longer exists - OrangeFox
        # dropped it along with fox_9.0/fox_10.0 support in their own sync
        # tooling. This community script (DarthJabba9/XenonTheInertG,
        # ofox-sync) rebuilds the same fox_10.0 tree from sources that are
        # still live: the TWRP minimal-manifest on GitHub, patched, plus
        # OrangeFox's bootable/Recovery and vendor/recovery repos at their
        # fox_10.0 branch (both still exist on GitLab, just not through the
        # retired Manifest.git shortcut).
        git clone https://github.com/XenonTheInertG/ofox-sync.git ~/ofox-sync
        cd ~/ofox-sync
        chmod +x get_fox_10.sh
        # get_fox_10.sh hardcodes the minimal-manifest clone over git://,
        # which uses raw port 9418 - GitHub Actions runners can't reach it
        # (times out, confirmed by an earlier failed run here). Repoint it
        # at https:// instead, same repo and branch, just a routable protocol.
        sed -i 's#git://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git#https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git#' get_fox_10.sh
        ./get_fox_10.sh ~/TWRP/fox_10.0
        # get_fox_10.sh checks out the fox_10.0 *branch* head, not a pinned
        # release. Pin bootable/Recovery to the R10.1 tag specifically -
        # confirmed to exist on GitLab. vendor/recovery's tags aren't
        # confirmed, so try R10.1 there too but fall back to the branch
        # head rather than failing the build if that tag's missing.
        cd ~/TWRP/fox_10.0/bootable/recovery && git fetch --tags && git checkout R10.1
        cd ~/TWRP/fox_10.0/vendor/recovery && git fetch --tags && (git checkout R10.1 || echo "No R10.1 tag on vendor/recovery, staying on fox_10.0 branch head")
        cd ~/TWRP/fox_10.0
        git clone --branch android-6.0 --single-branch https://github.com/notnoelchannel2/twrp_device_samsung_j3y17lte.git ~/TWRP/fox_10.0/device/samsung/j3y17lte
    - name: Downloading Magisk v30.7 for Fox Addons
      run: |
        mkdir -p ~/fox-addons
        curl -L -o ~/fox-addons/Magisk-v30.7.zip https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
        echo "Saved to ~/fox-addons/Magisk-v30.7.zip — build step points FOX_USE_SPECIFIC_MAGISK_ZIP at this file"
    - name: Patching fox_list_apps for user + system apps
      run: |
        TARGET=$(find ~/TWRP -type f -path "*FoxExtras/sbin/fox_list_apps" 2>/dev/null | head -n1)
        if [ -z "$TARGET" ]; then
          echo "fox_list_apps not found in synced source — skipping patch, App Manager list may stay broken."
        else
          echo "Patching: $TARGET"
        cat > "$TARGET" << 'FOXLISTAPPS_EOF'
        #!/sbin/sh
        # fox_list_apps - patched
        #
        
        list_dir="/tmp/listapps/list"
        rm -rf /tmp/listapps
        mkdir -p "$list_dir"
        
        # advanced.xml's apps_load page only mounts /data before calling this
        # script, so /system scanning would come back empty without this.
        # Both calls can fail silently (already mounted, or no separate
        # /system partition on this layout) - that's fine, ignore it.
        mount /system 2>/dev/null
        mount -o ro /system 2>/dev/null
        
        # No aapt here - recovery doesn't run PackageManager, so there's no
        # real label to fetch anyway. Package ID for everything, user and
        # system alike, so what you see is what you'd target for backup/delete.
        add_entry() {
            local fullpath="$1"
            local tag="$2"
            local parent
            local pkgname
            local display
        
            # parameter expansion instead of basename/dirname - saves two
            # forks per app, which adds up once you're running this on
            # hundreds of them
            local dir_only="${fullpath%/*}"
            parent="${dir_only##*/}"
            case "$parent" in
                base.apk|"") pkgname="${fullpath##*/}"; pkgname="${pkgname%.apk}" ;;
                *) pkgname="${parent%%-*}" ;;
            esac
            [ -z "$pkgname" ] && return
        
            if [ "$tag" = "system" ]; then
                display="[System] ${pkgname}"
            else
                display="${pkgname}"
            fi
        
            # filenames can't contain '/'. no portable way to global-replace
            # with parameter expansion, so tr it is - but only when there's
            # actually a slash to fix, no point forking otherwise
            case "$display" in
                */*) display="$(echo "$display" | tr '/' '-')" ;;
            esac
        
            # keyed on package name so the same app can't show up twice
            [ -e "$list_dir/$display" ] && return
        
            # advanced.xml's delete action runs:
            #   rm -rf "$(cat "%amgr_file%")"
            # so the entry file has to hold the real path, not be empty. For
            # something like /data/app/pkg-hash/base.apk that's the pkg-hash
            # folder, one level up. Same deal for system apps - deleting the
            # wrong one here can break boot, and there's no extra confirmation
            # beyond the usual swipe.
            echo "$dir_only" > "$list_dir/$display" 2>/dev/null
        }
        
        scan_dir() {
            local base_dir="$1"
            local tag="$2"
            [ -d "$base_dir" ] || return
            find "$base_dir" -mindepth 1 -maxdepth 3 -iname "*.apk" 2>/dev/null | while read -r fullpath; do
                add_entry "$fullpath" "$tag"
            done
        }
        
        scan_dir "/data/app" "user"
        
        # try the flat AOSP path first, then the nested one some OEM builds
        # use instead. Confirmed on this device: /system mounts the partition
        # root, and the real tree lives one level down at /system/system/app,
        # alongside product/vendor.
        scan_dir "/system/app" "system"
        scan_dir "/system/priv-app" "system"
        scan_dir "/system/system/app" "system"
        scan_dir "/system/system/priv-app" "system"
        
        exit 0
        FOXLISTAPPS_EOF
          chmod 755 "$TARGET"
          echo "Patched fox_list_apps successfully"
        fi
    - name: Building TWRP
      run: |
        OLDPATH=$PATH
        OLDJAVAHOME=$JAVA_HOME
        export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
        export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
        export FOX_USE_SPECIFIC_MAGISK_ZIP="$HOME/fox-addons/Magisk-v30.7.zip"
        cd ~/TWRP/fox_10.0
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        export OF_USE_GREEN_LED=0
        export FOX_REMOVE_AAPT=1
        export OF_VANILLA_BUILD=1
        export OF_FLASHLIGHT_ENABLE=0
        export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/SYSTEM"
        export FOX_RECOVERY_BOOT_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/BOOT"
        export FOX_RECOVERY_INSTALL_PARTITION="/dev/block/platform/13540000.dwmmc0/by-name/RECOVERY"
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export OF_LEGACY_SHAR512=1
        export OF_DISABLE_KEYMASTER2=1
        export OF_MAINTAINER="notnoelchannel"
        export TARGET_ARCH="arm64"
        export FOX_BUILD_TYPE="Stable"
        lunch omni_j3y17lte-eng
        mka recoveryimage
        export PATH=$OLDPATH
        export JAVA_HOME=$OLDJAVAHOME
    - name: Repackaging OrangeFox zip
      id: repackage
      run: |
        cd /home/runner/TWRP/fox_10.0/out/target/product/j3y17lte
        FOX_ZIP=$(find . -maxdepth 1 -iname "OrangeFox*.zip" | head -n1)
        if [ -z "$FOX_ZIP" ]; then
          echo "No OrangeFox zip found to repackage — skipping."
        else
          echo "Repackaging: $FOX_ZIP"
          mkdir -p /tmp/fox_repack
          unzip -q "$FOX_ZIP" -d /tmp/fox_repack
          rm -f "$FOX_ZIP"
          cd /tmp/fox_repack
          OUT_ZIP="/home/runner/TWRP/fox_10.0/out/target/product/j3y17lte/$(basename "$FOX_ZIP")"
          rm -f "$OUT_ZIP"
          zip -X -D "$OUT_ZIP" META-INF/com/google/android/updater-script META-INF/com/google/android/update-binary > /dev/null
          zip -r -X -D "$OUT_ZIP" META-INF -x "META-INF/com/google/android/updater-script" -x "META-INF/com/google/android/update-binary" > /dev/null
          zip -r -X -D "$OUT_ZIP" . -x "META-INF/*" > /dev/null
          echo "Repackaged $(basename "$FOX_ZIP") with META-INF first"
          echo "zip_name=$(basename "$FOX_ZIP")" >> "$GITHUB_OUTPUT"
        fi
    - name: Uploading TWRP builds
      uses: actions/upload-artifact@v7
      with:
        name: ofrp
        path: /home/runner/TWRP/fox_10.0/out/target/product/j3y17lte/recovery.*
        
    - name: Uploading OFRP ZIP build (installer, unzipped download)
      if: steps.repackage.outputs.zip_name != ''
      uses: actions/upload-artifact@v7
      with:
        path: /home/runner/TWRP/fox_10.0/out/target/product/j3y17lte/${{ steps.repackage.outputs.zip_name }}
        archive: false

    - name: Uploading extra theme zips
      uses: actions/upload-artifact@v7
      with:
        name: ofrp-extras
        path: |
          /home/runner/TWRP/fox_10.0/out/target/product/j3y17lte/*.zip
          !/home/runner/TWRP/fox_10.0/out/target/product/j3y17lte/${{ steps.repackage.outputs.zip_name }}
